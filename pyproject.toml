[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor"
version = "6.0.0"
description = "Internal web app for batch jobs: property image processing and bulk PDF flattening"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]
keywords = ["image", "batch", "resize", "rename", "csv", "pdf", "flatten", "fastapi"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pandas>=1.3.0",
    "openpyxl>=3.1.0",
    "Pillow>=9.0.0",
    "requests>=2.26.0",
]

[project.optional-dependencies]
# The PDF flatten tool. Installed separately so a network that cannot reach
# github.com does not break the install of everything else.
flatten = ["flatten-pdf @ git+https://github.com/adityakajaleyardi/Flatten.git"]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "ruff>=0.4",
]

[project.scripts]
image-processor = "cli:main"

[tool.setuptools]
packages = ["app", "app.processing", "app.tools", "app.tools.images", "app.tools.flatten"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/*/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Tests read better with long descriptive names and inline CSV rows.
"tests/*" = ["E501"]
